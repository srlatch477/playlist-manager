name: create-jar
run-name: Create Jar
on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - name: Build with Maven
        run: mvn package

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
